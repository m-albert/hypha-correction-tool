[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hypha-correction-tool"
version = "0.2.0"
description = "Browser-based correction of TIFF instance-segmentation masks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imjoy-rpc==0.5.59",
    "numpy<2",
    "scikit-image>=0.24",
    "tifffile>=2024.8.10",
    "websockets<12",
]

[project.scripts]
serve = "serve_tool:main"

[tool.setuptools]
py-modules = ["correction_server", "serve_tool"]

[tool.ruff]
target-version = "py310"
